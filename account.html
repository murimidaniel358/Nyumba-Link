<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Login / Sign Up — Nyumba Link</title><link rel=stylesheet href=styles.css><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel=stylesheet></head><body><div id=hd></div><main><section class=wrap><form id=af class="panel form"><h1>Login / Sign up</h1><input name=name placeholder="Full name" required><input name=email type=email placeholder="Email" required><select name=role><option value=student>Student</option><option value=landlord>Individual landlord</option><option value=agent>Real estate agent</option></select><button class=btn>Continue</button><small>Demo sign-in only: nothing is sent to a server yet. Real accounts, dashboard and admin come with the Supabase step.</small></form></section></main><footer id=ft></footer><div id=toast></div><script src=common.js></script><script>const r=new URLSearchParams(location.search).get('role');if(r)af.role.value=r;af.onsubmit=e=>{e.preventDefault();localStorage.nl_user=JSON.stringify(Object.fromEntries(new FormData(af)));location.href='index.html'}</script></body></html>
